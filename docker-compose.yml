version: '3.8'

services:
  ml-worker:
    build: .
    container_name: dicatatin_ml_worker
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3